{% if form.non_field_errors %}<div class="form-alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}" data-field="{{ field.name }}">
  {{ field.label_tag }}{{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  <div class="field-error" id="{{ field.auto_id }}_error" aria-live="polite">{{ field.errors|striptags }}</div>
</div>
{% endfor %}
